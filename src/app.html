<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>CW portfolio</title>
		<meta name="description" content="christopher's portfolio" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />

		<meta property="og:title" content="Ceek" />
		<meta property="og:description" content="christopher's portfolio" />
		<meta property="og:image" content="%sveltekit.assets%/portfolio icon/favicon-32x32.avif" />
		<meta property="og:url" content="https://ceek.dev/" />
		<meta property="og:type" content="website" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Ceek" />
		<meta name="twitter:description" content="christopher's portfolio" />
		<meta name="twitter:image" content="%sveltekit.assets%/portfolio icon/favicon-32x32.avif" />

		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/portfolio icon/favicon-32x32.avif"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/portfolio icon/favicon-32x32.avif"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/portfolio icon/favicon-16x16.avif"
		/>
		<link rel="manifest" href="%sveltekit.assets%/portfolio icon/site.webmanifest">
		<link
			rel="preload"
			href="%sveltekit.assets%/app.css"
			as="style"
			onload="this.rel = 'stylesheet'"
		/>
		<!-- <link
			rel="stylesheet"
			href="%sveltekit.assets%/spalsh.css"
			as="style"
			onload="this.rel = 'stylesheet'"
		/> -->
		<meta name="viewport" content="width=device-width, initial-scale=1 viewport-fit=auto interactive-widget=overlays-content" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
